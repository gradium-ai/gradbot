[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "gradbot"
version = "0.1.1"
description = "Python bindings for gradbot voice AI library"
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "httpx", "fastapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.maturin]
features = ["extension"]
module-name = "gradbot._gradbot"
