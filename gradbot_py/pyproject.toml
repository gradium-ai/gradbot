[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "gradbot"
version = "0.1.2"
description = "Python bindings for gradbot voice AI library"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["voice", "ai", "speech", "tts", "stt", "realtime"]
authors = [
    { name = "Laurent M", email = "laurent@gradium.ai" },
    { name = "Pratim Bhosale", email = "pratimbhosale@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.optional-dependencies]
demos = ["fastapi", "uvicorn", "pyyaml"]
test = ["pytest", "pytest-asyncio", "httpx", "fastapi", "pyyaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.maturin]
features = ["extension"]
module-name = "gradbot._gradbot"
