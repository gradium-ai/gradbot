[project]
name = "interview-questions"
version = "0.1.0"
description = "Simple French Gradbot voice chat (Notre IA)."
requires-python = ">=3.12"
dependencies = ["gradbot"]

[project.scripts]
demo = "main:app"

[tool.uv.sources]
gradbot = { path = "../../gradbot_py" }

[tool.uv]
exclude-newer = "7 days"

[tool.uv.audit]
malware-check = true
