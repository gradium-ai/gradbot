<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="static/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradbot Voice Workshop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1a1a1a;
            --ink-soft: #444;
            --ink-faint: #666;
            --surface: #faf9f7;
            --surface-raised: #fff;
            --accent: #2a2a2a;
            --accent-hover: #000;
            --border: #e8e6e1;
            --border-light: #f0eee9;
            --danger: #c44;
            --active: #2d8a4e;
            --border-hover: #c5c2bc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--surface);
            background-image:
                radial-gradient(ellipse 80% 60% at 50% 0%, rgba(210,200,185,0.25) 0%, transparent 70%),
                radial-gradient(ellipse 60% 50% at 80% 100%, rgba(190,200,210,0.15) 0%, transparent 60%);
            color: var(--ink);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-family: 'Instrument Serif', serif;
            font-weight: 400;
            font-size: 2.75rem;
            letter-spacing: -0.02em;
            line-height: 1.1;
            color: var(--ink);
            margin-bottom: 0.5rem;
        }

        .header p {
            font-family: 'Instrument Serif', serif;
            font-style: italic;
            font-size: 1.0625rem;
            color: var(--ink-faint);
            font-weight: 400;
            letter-spacing: 0.005em;
        }

        .header::after {
            content: '';
            display: block;
            width: 32px;
            height: 1.5px;
            background: var(--border);
            margin: 1.25rem auto 0;
        }

        /* Orb — the main interaction point */
        .orb-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1.75rem;
        }

        .orb-wrap {
            position: relative;
            width: 140px;
            height: 140px;
            margin-bottom: 1.25rem;
        }

        /* Outer glow layer */
        .orb-glow {
            position: absolute;
            inset: -16px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,0,0,0.03) 40%, transparent 70%);
            transition: background 0.5s;
            pointer-events: none;
        }

        .orb-wrap.active .orb-glow {
            background: radial-gradient(circle, rgba(45,138,78,0.12) 30%, transparent 70%);
            animation: glow-pulse 2.5s ease-in-out infinite;
        }

        @keyframes glow-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.06); }
        }

        .orb-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1.5px solid var(--border);
            transition: border-color 0.4s, transform 0.4s;
        }

        .orb-wrap.active .orb-ring {
            border-color: var(--active);
            animation: orb-breathe 2.5s ease-in-out infinite;
        }

        @keyframes orb-breathe {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.06); opacity: 0.5; }
        }

        .orb-btn {
            position: absolute;
            inset: 14px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(145deg, #333, #1a1a1a);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s, transform 0.15s, box-shadow 0.3s;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15), 0 1px 4px rgba(0,0,0,0.1);
        }

        .orb-btn:hover {
            background: linear-gradient(145deg, #444, #222);
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2), 0 2px 6px rgba(0,0,0,0.12);
        }
        .orb-btn:active { transform: scale(0.97); }

        .orb-btn.recording {
            background: linear-gradient(145deg, #d65, #b33);
            box-shadow: 0 4px 20px rgba(204,68,68,0.3), 0 1px 4px rgba(204,68,68,0.15);
        }
        .orb-btn.recording:hover {
            background: linear-gradient(145deg, #c55, #a22);
            box-shadow: 0 6px 24px rgba(204,68,68,0.4), 0 2px 6px rgba(204,68,68,0.2);
        }
        .orb-btn svg { transition: opacity 0.2s; }

        .orb-status {
            font-size: 0.875rem;
            color: var(--ink-soft);
            letter-spacing: 0.03em;
            min-height: 1.2em;
            transition: color 0.3s;
        }

        .orb-status.active { color: var(--active); }
        .orb-status.error { color: var(--danger); }

        /* Controls row — beneath orb */
        .controls-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
            width: 100%;
            max-width: 560px;
            flex-wrap: wrap;
        }

        .workflow {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .workflow-step {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            color: var(--ink-faint);
            font-size: 0.75rem;
        }

        .workflow-step::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--border-hover);
            box-shadow: 0 0 0 4px var(--border-light);
        }

        .workflow-step.active,
        .workflow-step.complete { color: var(--ink); }
        .workflow-step.active::before { background: var(--active); }
        .workflow-step.complete::before { background: var(--ink); }

        .design-state {
            width: 100%;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: start;
            gap: 0.75rem;
            padding: 0.875rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: color-mix(in srgb, var(--surface-raised) 88%, #e8f3ea);
        }

        .design-state.finalized {
            background: #edf6ef;
            border-color: #cce1d1;
        }

        .design-mark {
            width: 10px;
            height: 10px;
            margin-top: 0.25rem;
            border-radius: 50%;
            background: var(--border-hover);
        }

        .design-state.designing .design-mark {
            background: var(--active);
            animation: glow-pulse 1.4s ease-in-out infinite;
        }

        .design-state.finalized .design-mark { background: var(--active); }

        .design-copy { min-width: 0; }

        .design-label {
            color: var(--ink-faint);
            font-size: 0.6875rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 0.2rem;
        }

        .design-description {
            color: var(--ink);
            font-size: 0.875rem;
            line-height: 1.45;
        }

        .revision {
            color: var(--ink-faint);
            font-size: 0.75rem;
            white-space: nowrap;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.5rem 0.75rem;
            border: 1.5px solid var(--border);
            border-radius: 100px;
            color: var(--ink-soft);
            font-size: 0.8125rem;
        }

        .speed-control input {
            width: 88px;
            accent-color: var(--ink);
        }

        .speed-value {
            min-width: 2.2rem;
            color: var(--ink);
            font-variant-numeric: tabular-nums;
        }

        /* Custom dropdown */
        .dropdown {
            position: relative;
            flex: 1;
            min-width: 0;
        }

        .dropdown-trigger {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: transparent;
            border: 1.5px solid var(--border);
            border-radius: 100px;
            font-family: inherit;
            font-size: 0.875rem;
            color: var(--ink);
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            white-space: nowrap;
            overflow: hidden;
        }

        .dropdown-trigger:hover { border-color: var(--border-hover); }
        .dropdown-trigger:focus, .dropdown.open .dropdown-trigger {
            border-color: var(--ink-soft);
            box-shadow: 0 0 0 3px rgba(0,0,0,0.04);
        }

        .dropdown-trigger .dd-text {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dropdown-trigger .dd-chevron {
            flex-shrink: 0;
            width: 16px;
            height: 16px;
            color: var(--ink-faint);
            transition: transform 0.2s;
        }

        .dropdown.open .dd-chevron { transform: rotate(180deg); }

        .dropdown-menu {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 0;
            right: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(8px);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            padding: 0.375rem;
            max-height: 240px;
            overflow-y: auto;
            opacity: 0;
            visibility: hidden;
            transform: translateY(6px);
            transition: opacity 0.18s, transform 0.18s, visibility 0.18s;
            z-index: 50;
            box-shadow: 0 12px 32px rgba(0,0,0,0.1), 0 4px 12px rgba(0,0,0,0.05);
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .dropdown-menu::-webkit-scrollbar { width: 4px; }
        .dropdown-menu::-webkit-scrollbar-track { background: transparent; }
        .dropdown-menu::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .dropdown.open .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.625rem;
            border-radius: 10px;
            font-size: 0.875rem;
            color: var(--ink);
            cursor: pointer;
            transition: background 0.15s;
        }

        .dropdown-item:hover { background: var(--border-light); }
        .dropdown-item.selected { background: var(--border-light); font-weight: 500; }

        .dropdown-item .flag {
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        /* Divider between languages in dropdown */
        .dropdown-divider {
            height: 1px;
            background: var(--border-light);
            margin: 0.25rem 0.5rem;
        }

        /* Echo toggle — pill style to match dropdown */
        .echo-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            padding: 0.5rem 0.75rem;
            border: 1.5px solid var(--border);
            border-radius: 100px;
            transition: border-color 0.2s;
        }

        .echo-toggle:hover { border-color: var(--border-hover); }
        .echo-toggle:focus-within { border-color: var(--ink-soft); box-shadow: 0 0 0 3px rgba(0,0,0,0.04); }

        .echo-toggle input { display: none; }

        .echo-toggle .track {
            width: 30px;
            height: 17px;
            background: var(--border);
            border-radius: 10px;
            position: relative;
            transition: background 0.25s;
            flex-shrink: 0;
        }

        .echo-toggle .track::after {
            content: '';
            position: absolute;
            width: 13px;
            height: 13px;
            background: #fff;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: transform 0.25s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }

        .echo-toggle input:checked + .track {
            background: var(--ink);
        }

        .echo-toggle input:checked + .track::after {
            transform: translateX(13px);
        }

        .echo-toggle .echo-label {
            font-size: 0.8125rem;
            color: var(--ink-soft);
        }

        /* Transcript */
        .transcript-section {
            width: 100%;
            background: var(--surface-raised);
            border: 1px solid var(--border-light);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.02);
        }

        .transcript-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.625rem 0.875rem;
            border-bottom: 1px solid var(--border-light);
        }

        .transcript-header span {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--ink-soft);
            font-weight: 500;
        }

        .transcript {
            max-height: 280px;
            overflow-y: auto;
            padding: 0.75rem;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .transcript::-webkit-scrollbar { width: 4px; }
        .transcript::-webkit-scrollbar-track { background: transparent; }
        .transcript::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .transcript-empty {
            text-align: center;
            color: var(--ink-faint);
            font-size: 0.875rem;
            padding: 2rem 0;
            font-weight: 400;
            font-style: italic;
        }

        .transcript-item {
            margin-bottom: 0.625rem;
            padding: 0.5rem 0.625rem;
            border-radius: 8px;
            animation: msg-in 0.25s ease-out;
        }

        @keyframes msg-in {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .transcript-item.user {
            background: linear-gradient(135deg, #f5f4f1, #efeee9);
            margin-left: 2.5rem;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .transcript-item.assistant {
            background: linear-gradient(135deg, #f0f7f2, #e8f3ea);
            margin-right: 2.5rem;
            border: 1px solid rgba(45,138,78,0.06);
        }

        .transcript-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--ink-soft);
            margin-bottom: 0.2rem;
            font-weight: 500;
        }

        .transcript-text {
            font-size: 0.9375rem;
            line-height: 1.55;
            color: var(--ink);
        }

        /* Powered by */
        .powered-by {
            position: fixed;
            top: 1rem;
            right: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--ink-soft);
            font-size: 0.75rem;
            font-weight: 600;
            opacity: 0.7;
            letter-spacing: 0.02em;
        }

        .powered-by svg {
            height: 22px;
            width: auto;
        }

        /* Visualizer canvas — hidden but functional for audio analysis */
        .visualizer-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }

        /* Entry animation */
        .container > * {
            animation: fade-up 0.5s ease-out both;
        }
        .container > :nth-child(1) { animation-delay: 0s; }
        .container > :nth-child(2) { animation-delay: 0.08s; }
        .container > :nth-child(3) { animation-delay: 0.16s; }
        .container > :nth-child(4) { animation-delay: 0.24s; }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            body { padding: 1.5rem 1rem; }
            .header h1 { font-size: 2rem; }
            .controls-bar {
                flex-direction: column;
                gap: 0.625rem;
                max-width: 100%;
            }
            .dropdown { width: 100%; }
            .speed-control, .echo-toggle { width: 100%; justify-content: center; }
            .workflow-step { font-size: 0.6875rem; }
            .transcript-item.user { margin-left: 1.5rem; }
            .transcript-item.assistant { margin-right: 1.5rem; }
            .powered-by { position: static; margin-top: 2rem; opacity: 0.5; }
        }

        @media (min-height: 800px) {
            .header { margin-bottom: 3rem; }
            .orb-section { margin-bottom: 2.25rem; }
        }
        /* Watercolor studio: the brush is the call control, the page its paper. */
        :root { --ink: #302d29; --ink-soft: #625c54; --ink-faint: #756d63; --surface: #f4eee3; --surface-raised: #f8f3eb; --border: #dcd2c3; --border-light: #e5dbce; --active: #97654d; }
        body { justify-content: flex-start; padding: 100px 24px 32px; background: var(--surface); }
        body::before { content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .055; z-index: -1; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23745c40' filter='url(%23n)' d='M0 0h180v180H0z'/%3E%3C/svg%3E"); }
        .container { max-width: 760px; }
        .studio-brand { position: absolute; top: 28px; left: 40px; font: 30px Georgia, serif; display: flex; align-items: center; gap: 22px; }
        .studio-brand span { font: 14px 'DM Sans', sans-serif; padding-left: 22px; border-left: 1px solid var(--border); }
        .header { margin: 8px 0 0; }
        .header h1 { font-size: 2.6rem; margin-bottom: 10px; }
        .header p { font: 14px 'DM Sans', sans-serif; }
        .header::after, .workflow, .orb-glow, .orb-ring { display: none; }
        .orb-section { width: 100%; margin: 0 0 28px; }
        .orb-wrap { width: min(100%, 600px); height: auto; aspect-ratio: 600 / 310; margin: 0; }
        .orb-btn, .orb-btn:hover, .orb-btn.recording, .orb-btn.recording:hover { inset: 0; border-radius: 24px; background: transparent; box-shadow: none; transform: none; color: var(--ink); }
        .orb-btn:focus-visible { outline: 2px solid #9b745d; outline-offset: 4px; }
        .orb-btn #iconMic, .orb-btn #iconStop { display: none !important; }
        .brush-scene { display: block; width: 100%; height: 100%; overflow: visible; }
        .painting-brush { transform-origin: 301px 241px; transition: transform .3s cubic-bezier(.25,1,.5,1); }
        .orb-btn:hover .painting-brush { transform: translateY(-5px) rotate(-2deg); }
        .paint-washes { transform-origin: 300px 255px; transition: opacity .3s; }
        .orb-wrap[data-motion='listening'] .painting-brush { animation: brush-listen 5s ease-in-out infinite; }
        .orb-wrap[data-motion='speaking'] .painting-brush { animation: brush-paint 3.6s ease-in-out infinite; }
        .orb-wrap[data-motion='designing'] .painting-brush { animation: brush-paint 6s ease-in-out infinite; }
        .statue-pigment { opacity: 0; transition: opacity .4s; mix-blend-mode: multiply; }
        .orb-wrap.active .statue-pigment { opacity: 1; }
        .statue-wash { opacity: .12; animation: stone-wash 6s ease-in-out infinite paused; }
        .statue-wash:nth-child(2) { animation-delay: -2s; }
        .statue-wash:nth-child(3) { animation-delay: -4s; }
        .orb-wrap[data-motion='speaking'] .statue-wash, .orb-wrap[data-motion='designing'] .statue-wash { animation-play-state: running; }
        @keyframes stone-wash { 0%,100% { opacity: .12; } 35%,65% { opacity: .48; } }
        @keyframes brush-listen { 0%,100% { transform: translateY(-3px) rotate(-1deg); } 50% { transform: translateY(-7px) rotate(1deg); } }
        @keyframes brush-paint { 0%,100% { transform: translate(-32px, -35px) rotate(-5deg); } 50% { transform: translate(20px, 20px) rotate(6deg); } }
        @keyframes pigment-bloom { 0%,100% { opacity: .7; transform: scale(.98); } 50% { opacity: 1; transform: scale(1.035); } }
        .orb-status { font-size: 14px; letter-spacing: 0; }
        .orb-status::before { content: ''; display: inline-block; width: 7px; height: 7px; margin-right: 9px; background: #bd947d; border-radius: 50%; }
        .brush-hint { margin-top: 8px; font-size: 12px; color: var(--ink-faint); }
        .controls-bar { order: 4; margin: 24px 0 0; max-width: 760px; gap: 20px; border-top: 1px solid var(--border); padding-top: 20px; }
        .dropdown-trigger, .speed-control, .echo-toggle { background: transparent; box-shadow: none; }
        .design-state { order: 5; border: 0; border-radius: 0; background: transparent; box-shadow: none; margin: 18px 0 0; padding: 16px 0; }
        .design-description { max-width: 65ch; }
        .design-mark { background: #c9917a; border-radius: 43% 57% 55% 45%; box-shadow: 10px 3px 0 #dcc0a1, 20px -2px 0 #b7afbe; margin-right: 22px; }
        .transcript-section { width: min(100%, 640px); border: 0; border-radius: 0; background: transparent; box-shadow: none; }
        .transcript-header { padding: 0 0 16px; border: 0; }
        .transcript-header span { font-size: 10px; letter-spacing: .15em; color: var(--ink-faint); }
        .transcript { padding: 0 8px 0 0; max-height: 300px; min-height: 100px; }
        .transcript-empty { text-align: left; padding: 20px 0; font: italic 21px 'Instrument Serif', Georgia, serif; }
        .transcript-item.user, .transcript-item.assistant { margin: 0 0 24px; padding: 0; background: transparent; border: 0; border-radius: 0; }
        .transcript-label { font-size: 10px; letter-spacing: .13em; margin-bottom: 7px; color: #64737d; }
        .transcript-item.user .transcript-label { color: #9d6148; }
        .transcript-text { font-size: 20px; line-height: 1.5; }
        .powered-by { position: absolute; top: 36px; right: 40px; font-size: 10px; }
        .powered-by svg { height: 15px; }
        @media (max-width: 600px) { body { padding: 95px 24px 24px; } .studio-brand { top: 24px; left: 24px; font-size: 25px; gap: 12px; } .studio-brand span { padding-left: 12px; font-size: 12px; } .powered-by { display: none; } .header h1 { font-size: 2.2rem; } .orb-section { margin-bottom: 32px; } .controls-bar { flex-direction: row; gap: 12px; } .dropdown { width: 100%; } .speed-control, .echo-toggle { width: auto; } .transcript-text { font-size: 18px; } }
        @media (max-width: 600px) { .controls-bar { flex-wrap: wrap; } .dropdown { flex: 1 0 100%; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<body>
    <div class="container">

                            <filter id="stoneGrey" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope=".6" intercept=".32"/><feFuncG type="linear" slope=".59" intercept=".31"/><feFuncB type="linear" slope=".57" intercept=".29"/></feComponentTransfer><feGaussianBlur stdDeviation=".3"/></filter>
                            <linearGradient id="stoneFade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="white" stop-opacity=".65"/><stop offset=".25" stop-color="white"/><stop offset=".66" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>

    <script>
        const FLAGS = {
            en: '\u{1F1EC}\u{1F1E7}',
            fr: '\u{1F1EB}\u{1F1F7}',
            de: '\u{1F1E9}\u{1F1EA}',
            es: '\u{1F1EA}\u{1F1F8}',
            pt: '\u{1F1E7}\u{1F1F7}'
        };
        const DEFAULT_VOICE = Object.freeze({
            name: 'Harper',
            voice_id: '4SZHfMpw-p46Ywgs',
            language: 'en'
        });

        // State
        let voices = [];
        let selectedVoice = null;
        let selectedVoiceId = null;
        let selectedVoiceLang = null;
        let ws = null;
        let player = null;
        let isRecording = false;
        let turnBubbles = {};
        let userActivityReported = false;
        let currentUserTranscript = '';

        // DOM
        const dropdown = document.getElementById('voiceDropdown');
        const ddTrigger = document.getElementById('dropdownTrigger');
        const ddMenu = document.getElementById('dropdownMenu');
        const ddText = document.getElementById('ddText');
        const orbBtn = document.getElementById('orbBtn');
        const orbWrap = document.getElementById('orbWrap');
        const iconMic = document.getElementById('iconMic');
        const iconStop = document.getElementById('iconStop');
        const statusEl = document.getElementById('status');
        const transcript = document.getElementById('transcript');
        const echoCancellationToggle = document.getElementById('echoCancellation');
        const speedSlider = document.getElementById('speed');
        const speedValue = document.getElementById('speedValue');
        const designState = document.getElementById('designState');
        const designLabel = document.getElementById('designLabel');
        const designDescription = document.getElementById('designDescription');
        const revision = document.getElementById('revision');
        const stepDescribe = document.getElementById('stepDescribe');
        const stepPreview = document.getElementById('stepPreview');
        const stepFinalize = document.getElementById('stepFinalize');

        // Custom dropdown logic
        function toggleDropdown() {
            const isOpen = dropdown.classList.toggle('open');
            ddTrigger.setAttribute('aria-expanded', isOpen);
        }

        function closeDropdown() {
            dropdown.classList.remove('open');
            ddTrigger.setAttribute('aria-expanded', 'false');
        }

        ddTrigger.addEventListener('click', (e) => { e.stopPropagation(); toggleDropdown(); });
        ddTrigger.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { closeDropdown(); return; }
            const isOpen = dropdown.classList.contains('open');
            if (!isOpen && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter' || e.key === ' ')) {
                e.preventDefault(); toggleDropdown(); return;
            }
            if (!isOpen) return;
            const items = [...ddMenu.querySelectorAll('.dropdown-item')];
            const current = items.findIndex(el => el.dataset.voice === selectedVoice);
            if (e.key === 'ArrowDown') { e.preventDefault(); const next = items[Math.min(current + 1, items.length - 1)]; selectVoice(next.dataset.voice, next.dataset.voiceId); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); const prev = items[Math.max(current - 1, 0)]; selectVoice(prev.dataset.voice, prev.dataset.voiceId); toggleDropdown(); }
            else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); closeDropdown(); }
        });
        document.addEventListener('click', closeDropdown);

        function selectVoice(name, voiceId) {
            selectedVoice = name;
            selectedVoiceId = voiceId || null;
            const v = voices.find(x => x.name === name);
            selectedVoiceLang = v ? v.language : null;
            const voice = voices.find(v => v.name === name);
            const flag = voice ? (FLAGS[voice.language] || '\u{1F310}') : '';
            ddText.textContent = `${flag}  ${name}`;
            ddMenu.querySelectorAll('.dropdown-item').forEach(el => {
                el.classList.toggle('selected', el.dataset.voice === name);
            });
            closeDropdown();
        }

        // Voices
        async function loadVoices() {
            try {
                const response = await fetch('/api/voices');
                const data = await response.json();
                voices = Array.isArray(data.voices) ? data.voices : [];
                // The API catalog is not ordered by product preference (it
                // currently starts with a German voice). Always put Harper first.
                voices = voices.filter((voice) =>
                    voice.voice_id !== DEFAULT_VOICE.voice_id &&
                    String(voice.name || '').toLowerCase() !== DEFAULT_VOICE.name.toLowerCase()
                );
                voices.unshift(DEFAULT_VOICE);
                renderVoices();
            } catch (error) {
                console.error('Failed to load voices:', error);
                voices = [DEFAULT_VOICE];
                renderVoices();
            }
        }

        function renderVoices() {
            ddMenu.innerHTML = '';
            let lastLang = null;
            voices.forEach((voice, i) => {
                const flag = FLAGS[voice.language] || '\u{1F310}';
                if (lastLang && voice.language !== lastLang) {
                    const div = document.createElement('div');
                    div.className = 'dropdown-divider';
                    ddMenu.appendChild(div);
                }
                lastLang = voice.language;
                const item = document.createElement('div');
                item.className = 'dropdown-item' + (i === 0 ? ' selected' : '');
                item.dataset.voice = voice.name;
                item.dataset.voiceId = voice.voice_id;
                item.setAttribute('role', 'option');
                item.innerHTML = `<span class="flag">${flag}</span><span>${voice.name}</span>`;
                ddMenu.appendChild(item);
            });
            selectVoice(DEFAULT_VOICE.name, DEFAULT_VOICE.voice_id);
        }

        ddMenu.addEventListener('click', (e) => {
            const item = e.target.closest('.dropdown-item');
            if (item) { e.stopPropagation(); selectVoice(item.dataset.voice, item.dataset.voiceId); }
        });

        // Transcript bubbles
        let userBubble = null;
        let hadAssistantBubble = false;
        let feedbackAudio = null;
        let feedbackAudioUrl = null;
        let feedbackTurnIdx = 1000000;

        function stopFeedbackAudio() {
            if (feedbackAudio) {
                feedbackAudio.pause();
                feedbackAudio.removeAttribute('src');
                feedbackAudio.load();
                feedbackAudio = null;
            }
            if (feedbackAudioUrl) {
                URL.revokeObjectURL(feedbackAudioUrl);
                feedbackAudioUrl = null;
            }
        }

        async function waitForStreamPlaybackDrain() {
            if (!player) return;
            await player.drain();
            // end_tts_audio marks server completion, while a small amount of
            // decoded audio may still be queued in the browser worklet. Use the
            // player's latest buffer metric so the designed voice never starts
            // on top of the acknowledgement.
            const measuredBufferMs = Number(player.bufferMs) || 0;
            const metricAgeMs = player.lastMetricTime
                ? Date.now() - player.lastMetricTime
                : measuredBufferMs;
            const remainingMs = Math.max(0, measuredBufferMs - metricAgeMs);
            if (remainingMs > 20) {
                await new Promise((resolve) => setTimeout(
                    resolve,
                    Math.min(remainingMs + 100, 5000)
                ));
            }
        }

        async function playVoiceFeedback(msg) {
            stopFeedbackAudio();
            const binary = atob(msg.audio_base64 || '');
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i += 1) {
                bytes[i] = binary.charCodeAt(i);
            }
            const url = URL.createObjectURL(new Blob(
                [bytes],
                { type: msg.mime_type || 'audio/wav' }
            ));
            const audio = new Audio(url);
            feedbackAudio = audio;
            feedbackAudioUrl = url;
            await waitForStreamPlaybackDrain();
            // User speech cancels pending designed-voice playback.
            if (feedbackAudio !== audio) return;
            orbWrap.dataset.motion = 'speaking';
            handleText({
                text: msg.text,
                turnIdx: feedbackTurnIdx++,
                isUser: false
            });
            statusEl.textContent = 'Playing designed voice';
            statusEl.className = 'orb-status active';
            audio.addEventListener('ended', () => {
                if (feedbackAudio === audio) {
                    feedbackAudio = null;
                    feedbackAudioUrl = null;
                    URL.revokeObjectURL(url);
                    statusEl.textContent = 'Listening for feedback';
                    statusEl.className = 'orb-status active';
                    orbWrap.dataset.motion = isRecording ? 'listening' : 'idle';
                }
            }, { once: true });
            try {
                await audio.play();
            } catch (error) {
                if (feedbackAudio === audio) stopFeedbackAudio();
                console.error('Could not play designed voice:', error);
                statusEl.textContent = 'Could not play designed voice';
                statusEl.className = 'orb-status error';
            }
        }

        function getBubbleForTurn(turnIdx, isUser) {
            if (isUser) {
                if (userBubble && !hadAssistantBubble) return userBubble;
                hadAssistantBubble = false;
                userBubble = document.createElement('div');
                userBubble.className = 'transcript-item user';
                userBubble.innerHTML = '<div class="transcript-label">You</div><div class="transcript-text"></div>';
                userBubble._textEl = userBubble.querySelector('.transcript-text');
                transcript.appendChild(userBubble);
                return userBubble;
            }
            let bubble = turnBubbles[turnIdx];
            if (!bubble) {
                hadAssistantBubble = true;
                bubble = document.createElement('div');
                bubble.className = 'transcript-item assistant';
                bubble.innerHTML = '<div class="transcript-label">Assistant</div><div class="transcript-text"></div>';
                bubble._textEl = bubble.querySelector('.transcript-text');
                transcript.appendChild(bubble);
                turnBubbles[turnIdx] = bubble;
            }
            return bubble;
        }

        let scrollRaf = 0;
        function handleText({ text, turnIdx, isUser }) {
            if (isUser) {
                if (feedbackAudio && !feedbackAudio.paused) stopFeedbackAudio();
                orbWrap.dataset.motion = 'listening';
                currentUserTranscript = `${currentUserTranscript} ${text}`.trim();
            }
            if (
                isUser &&
                !userActivityReported &&
                ws &&
                ws.readyState === WebSocket.OPEN
            ) {
                userActivityReported = true;
                ws.send(JSON.stringify({ type: 'config', user_activity: true }));
            }
            const bubble = getBubbleForTurn(turnIdx, isUser);
            bubble._textEl.textContent += text + ' ';
            while (transcript.children.length > 60) {
                const removed = transcript.removeChild(transcript.firstChild);
                for (const key in turnBubbles) {
                    if (turnBubbles[key] === removed) delete turnBubbles[key];
                }
                if (userBubble === removed) userBubble = null;
            }
            if (!scrollRaf) {
                scrollRaf = requestAnimationFrame(() => {
                    transcript.scrollTop = transcript.scrollHeight;
                    scrollRaf = 0;
                });
            }
        }

        function resetDesignState() {
            designState.className = 'design-state';
            designLabel.textContent = 'Ready for a description';
            designDescription.textContent = 'Start the call and describe the age, tone, accent, energy, or delivery you want.';
            revision.textContent = '';
            stepDescribe.className = 'workflow-step active';
            stepPreview.className = 'workflow-step';
            stepFinalize.className = 'workflow-step';
        }

        function handleVoiceDesignMessage(msg) {
            if (!msg || msg.type !== 'voice_design_status') return;

            if (msg.status === 'designing') {
                orbWrap.dataset.motion = 'designing';
                designState.className = 'design-state designing';
                designLabel.textContent = 'Designing a new voice…';
                designDescription.textContent = msg.description || 'Turning your description into a voice.';
                revision.textContent = msg.revision ? `Draft ${msg.revision}` : '';
                stepDescribe.className = 'workflow-step complete';
                stepPreview.className = 'workflow-step active';
                statusEl.textContent = 'Designing voice';
                statusEl.className = 'orb-status active';
                return;
            }

            if (msg.status === 'active') {
                designState.className = 'design-state';
                designLabel.textContent = 'Designed voice is live';
                designDescription.textContent = msg.description || 'The conversation is now using the new voice.';
                revision.textContent = msg.revision ? `Draft ${msg.revision}` : '';
                stepDescribe.className = 'workflow-step complete';
                stepPreview.className = 'workflow-step active';
                statusEl.textContent = 'Listening for feedback';
                statusEl.className = 'orb-status active';
                return;
            }

            if (msg.status === 'cancelled') {
                designState.className = 'design-state';
                designLabel.textContent = msg.revision ? 'Designed voice is live' : 'Ready for a description';
                designDescription.textContent = msg.description || 'Tell me the updated voice direction when you are ready.';
                revision.textContent = msg.revision ? `Draft ${msg.revision}` : '';
                stepDescribe.className = msg.revision ? 'workflow-step complete' : 'workflow-step active';
                stepPreview.className = msg.revision ? 'workflow-step active' : 'workflow-step';
                statusEl.textContent = 'Listening';
                statusEl.className = 'orb-status active';
                return;
            }

            if (msg.status === 'finalized') {
                designState.className = 'design-state finalized';
                designLabel.textContent = 'Voice kept';
                designDescription.textContent = msg.description || 'This voice is saved for the rest of the call.';
                revision.textContent = msg.voice_id ? `ID ${msg.voice_id}` : '';
                stepDescribe.className = 'workflow-step complete';
                stepPreview.className = 'workflow-step complete';
                stepFinalize.className = 'workflow-step complete';
                statusEl.textContent = 'Voice kept';
                statusEl.className = 'orb-status active';
                return;
            }

            if (msg.status === 'error') {
                designState.className = 'design-state';
                designLabel.textContent = 'Voice design failed';
                designDescription.textContent = msg.message || 'Try the request again.';
                statusEl.textContent = 'Voice design error';
                statusEl.className = 'orb-status error';
            }
        }

        // Toggle chat
        function toggleChat() {
            if (isRecording) {
                stopChat();
            } else {
                startChat();
            }
        }

        async function startChat() {
            if (orbBtn.disabled) return;
            if (!selectedVoice) {
                statusEl.textContent = 'Select a voice first';
                statusEl.className = 'orb-status error';
                return;
            }

            orbBtn.disabled = true;
            statusEl.textContent = 'Opening your studio…';
            transcript.innerHTML = '';
            turnBubbles = {};
            userBubble = null;
            hadAssistantBubble = false;
            userActivityReported = false;
            currentUserTranscript = '';
            stopFeedbackAudio();
            feedbackTurnIdx = 1000000;
            resetDesignState();

            player = new SyncedAudioPlayer({
                basePath: 'static/js',
                sampleRate: 24000,
                pcmOutput: window.__pcmOutput || false,
                echoCancellation: echoCancellationToggle.checked,
                onEncodedAudio: (opusData) => {
                    if (isRecording && ws && ws.readyState === WebSocket.OPEN) ws.send(opusData);
                },
                onText: handleText,
                onEndOfTurn: () => {
                    if (isRecording && !feedbackAudio) {
                        orbWrap.dataset.motion = designState.classList.contains('designing') ? 'designing' : 'listening';
                    }
                },
                onEvent: (eventType, msg) => {
                    console.log('Event:', eventType, msg);
                    if (eventType === 'first_tts_audio') orbWrap.dataset.motion = 'speaking';
                    if (eventType === 'end_tts_audio') player.scheduleEndOfTurn();
                    if (eventType === 'end_of_turn') {
                        if (
                            currentUserTranscript &&
                            ws &&
                            ws.readyState === WebSocket.OPEN
                        ) {
                            ws.send(JSON.stringify({
                                type: 'config',
                                user_activity: true,
                                user_text: currentUserTranscript
                            }));
                        }
                        currentUserTranscript = '';
                        userActivityReported = false;
                    }
                    if (eventType === 'voice_feedback_audio') {
                        void playVoiceFeedback(msg);
                    }
                    handleVoiceDesignMessage(msg || (typeof eventType === 'object' ? eventType : null));
                    if (eventType === 'demo_mode') {
                        statusEl.textContent = 'Demo mode';
                        statusEl.className = 'orb-status';
                    }
                },
                onError: (error) => {
                    console.error('Player error:', error);
                    statusEl.textContent = error.message;
                    statusEl.className = 'orb-status error';
                }
            });

            try {
                await player.start();
            } catch (error) {
                console.error('Failed to setup audio:', error);
                statusEl.textContent = 'Microphone access denied';
                statusEl.className = 'orb-status error';
                orbBtn.disabled = false;
                return;
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const basePath = window.location.pathname.replace(/\/$/, '');
            ws = new WebSocket(`${protocol}//${window.location.host}${basePath}/ws/chat`);

            ws.onopen = () => {
                ws.send(JSON.stringify({
                    type: 'start',
                    voice_name: selectedVoice,
                    voice_id: selectedVoiceId,
                    language: selectedVoiceLang,
                    speed: parseFloat(speedSlider.value)
                }));
                isRecording = true;
                orbBtn.disabled = false;
                orbBtn.setAttribute('aria-label', 'End voice chat');
                orbBtn.setAttribute('aria-pressed', 'true');
                orbWrap.dataset.motion = 'listening';
                orbBtn.classList.add('recording');
                orbWrap.classList.add('active');
                iconMic.style.display = 'none';
                iconStop.style.display = 'block';
                statusEl.textContent = 'Listening';
                statusEl.className = 'orb-status active';
                ddTrigger.disabled = true;
            };

            ws.onmessage = (event) => player.handleMessage(event.data);

            ws.onerror = () => {
                statusEl.textContent = 'Connection error';
                statusEl.className = 'orb-status error';
            };

            ws.onclose = () => {
                if (player) { player.stop(); player = null; }
                stopFeedbackAudio();
                resetUI();
                if (statusEl.textContent === 'Listening') {
                    statusEl.textContent = 'Disconnected';
                    statusEl.className = 'orb-status';
                }
            };
        }

        function stopChat() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'stop' }));
                ws.close();
            }
            ws = null;
            if (player) { player.stop(); player = null; }
            stopFeedbackAudio();
            resetUI();
            statusEl.textContent = 'Chat ended';
            statusEl.className = 'orb-status';
        }

        function resetUI() {
            isRecording = false;
            orbBtn.disabled = false;
            orbBtn.setAttribute('aria-label', 'Start voice chat');
            orbBtn.setAttribute('aria-pressed', 'false');
            orbWrap.dataset.motion = 'idle';
            userActivityReported = false;
            currentUserTranscript = '';
            orbBtn.classList.remove('recording');
            orbWrap.classList.remove('active');
            iconMic.style.display = 'block';
            iconStop.style.display = 'none';
            ddTrigger.disabled = false;
        }

        orbBtn.addEventListener('click', toggleChat);
        speedSlider.addEventListener('input', () => {
            speedValue.textContent = `${parseFloat(speedSlider.value).toFixed(1)}×`;
            if (ws && ws.readyState === WebSocket.OPEN && isRecording) {
                ws.send(JSON.stringify({ type: 'config', speed: parseFloat(speedSlider.value) }));
            }
        });
        loadVoices();
    </script>
</body>
