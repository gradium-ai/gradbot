# Loaded automatically when no local config.yaml exists.
# Copy to config.yaml to override anything below (config.yaml is git-ignored).

llm:
  model: "pipecat-ai/phonellm-alpha-1"
  # main.py reads PHONELLM_BASE_URL and optional PHONELLM_API_KEY directly.
  # These override this demo's URL/key; shared LLM_* settings remain unchanged.
  # export PHONELLM_BASE_URL=http://localhost:8001/v1
  extra_config:
    temperature: 0
    chat_template_kwargs:
      enable_thinking: false

session:
  # A pause should not make the design director speak again on its own.
  silence_timeout_s: 0.0
