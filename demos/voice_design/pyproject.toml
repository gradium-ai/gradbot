[project]
name = "voice-design"
version = "0.1.0"
description = "Conversational Gradium voice-design demo powered by PhoneLLM"
requires-python = ">=3.12"
dependencies = ["gradbot", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
demo = "main:app"

[tool.uv.sources]
# Build against the Gradbot package in this monorepo.
gradbot = { path = "../../gradbot_py" }
