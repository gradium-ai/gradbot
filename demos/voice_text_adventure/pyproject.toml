[project]
name = "voice-text-adventure"
version = "0.1.0"
description = "Voice-enabled text adventure using Jericho"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=11.0",
    "pygradbot",
    "pyyaml>=6.0",
    "jericho>=0.1.0",
    "spacy>=3.0.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
voice-adventure = "main:app"

[tool.uv.sources]
pygradbot = { path = "../../pygradbot" }