[project]
name = "hotel-reservation-demo"
version = "0.1.0"
description = "Voice AI hotel reservation agent with deferred search results"
requires-python = ">=3.12"
dependencies = ["gradbot", "linkup-sdk"]

[tool.uv.sources]
gradbot = { path = "../../gradbot_py" }

[tool.uv]
exclude-newer = "7 days"

[tool.uv.audit]
malware-check = true
