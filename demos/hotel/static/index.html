<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanderlust Travel - Hotel Reservations</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0c1220 0%, #1a2744 50%, #0c1220 100%);
            min-height: 100vh;
            color: #e8edf5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 0.25rem;
            font-size: 2.2rem;
            background: linear-gradient(90deg, #64b5f6, #e1bee7, #f48fb1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #7b8fa8;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        /* Agent card */
        .agent-card {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.25rem;
            border: 1px solid rgba(100, 181, 246, 0.2);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .agent-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #64b5f6, #ce93d8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .agent-info h2 {
            font-size: 1.15rem;
            margin-bottom: 0.15rem;
        }

        .agent-info .role {
            color: #7b8fa8;
            font-size: 0.85rem;
        }

        .recording-indicator {
            margin-left: auto;
            display: none;
            align-items: center;
            gap: 0.5rem;
            color: #4ade80;
            font-size: 0.85rem;
        }

        .recording-indicator.active {
            display: flex;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .recording-dot {
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 1.2s infinite;
        }

        /* Two-column layout */
        .main-panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            margin-bottom: 1.25rem;
        }

        @media (max-width: 768px) {
            .main-panels {
                grid-template-columns: 1fr;
            }
        }

        /* Hotel Display Panel */
        .hotel-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid rgba(100, 181, 246, 0.15);
            min-height: 450px;
            max-height: 650px;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            font-size: 0.8rem;
            color: #64b5f6;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 0.75rem;
        }

        .hotel-content {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }

        .hotel-empty {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4a5568;
            font-style: italic;
            text-align: center;
            padding: 2rem;
        }

        /* Searching spinner */
        .searching {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 2rem;
            color: #64b5f6;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(100, 181, 246, 0.2);
            border-top-color: #64b5f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* City header */
        .city-header {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1rem;
            height: 120px;
        }

        .city-header img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .city-header .city-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 0.75rem 1rem;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
        }

        .city-header .city-name {
            font-size: 1.3rem;
            font-weight: bold;
        }

        /* Hotel cards */
        .hotel-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 0.75rem;
            border: 1px solid rgba(100, 181, 246, 0.1);
            transition: border-color 0.2s;
        }

        .hotel-card:hover {
            border-color: rgba(100, 181, 246, 0.3);
        }

        .hotel-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }

        .hotel-card-body {
            padding: 0.75rem;
        }

        .hotel-card-name {
            font-size: 1rem;
            font-weight: bold;
            color: #e1bee7;
            margin-bottom: 0.2rem;
        }

        .hotel-card-stars {
            color: #ffd54f;
            font-size: 0.8rem;
            margin-bottom: 0.3rem;
        }

        .hotel-card-desc {
            font-size: 0.8rem;
            color: #9ca3af;
            line-height: 1.4;
            margin-bottom: 0.4rem;
        }

        .hotel-card-price {
            font-size: 0.85rem;
            color: #64b5f6;
            font-weight: 600;
        }

        .hotel-card-phone {
            font-size: 0.8rem;
            color: #90caf9;
            margin-top: 0.3rem;
        }

        .hotel-card-amenities {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-top: 0.4rem;
        }

        .amenity-tag {
            font-size: 0.65rem;
            padding: 0.15rem 0.4rem;
            background: rgba(100, 181, 246, 0.1);
            border-radius: 4px;
            color: #90caf9;
        }

        /* Room cards */
        .room-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 0.75rem;
            border: 1px solid rgba(225, 190, 231, 0.15);
        }

        .room-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }

        .room-card-body {
            padding: 0.75rem;
        }

        .room-card-type {
            font-size: 0.95rem;
            font-weight: bold;
            color: #e1bee7;
            margin-bottom: 0.2rem;
        }

        .room-card-price {
            font-size: 1.1rem;
            color: #4ade80;
            font-weight: bold;
            margin-bottom: 0.3rem;
        }

        .room-card-desc {
            font-size: 0.8rem;
            color: #9ca3af;
            line-height: 1.4;
        }

        .room-card-guests {
            font-size: 0.75rem;
            color: #7b8fa8;
            margin-top: 0.3rem;
        }

        /* Booking confirmed */
        .booking-card {
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.1), rgba(100, 181, 246, 0.1));
            border: 1px solid rgba(74, 222, 128, 0.3);
            border-radius: 12px;
            padding: 1.25rem;
            text-align: center;
        }

        .booking-card h3 {
            color: #4ade80;
            font-size: 1.2rem;
            margin-bottom: 0.75rem;
        }

        .booking-detail {
            display: flex;
            justify-content: space-between;
            padding: 0.35rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.85rem;
        }

        .booking-detail .label {
            color: #7b8fa8;
        }

        .booking-detail .value {
            font-weight: 600;
        }

        .confirmation-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #64b5f6;
            margin-top: 0.75rem;
            letter-spacing: 2px;
        }

        /* Transcript Panel */
        .transcript-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            min-height: 450px;
            max-height: 650px;
        }

        .transcript-container {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }

        .transcript-entry {
            margin-bottom: 0.6rem;
            padding: 0.6rem 0.85rem;
            border-radius: 8px;
            max-width: 85%;
            font-size: 0.9rem;
            line-height: 1.45;
        }

        .transcript-entry.user {
            background: rgba(100, 181, 246, 0.15);
            margin-left: auto;
            text-align: right;
            border: 1px solid rgba(100, 181, 246, 0.2);
        }

        .transcript-entry.assistant {
            background: rgba(225, 190, 231, 0.1);
            border: 1px solid rgba(225, 190, 231, 0.15);
        }

        .transcript-entry.system {
            background: rgba(100, 181, 246, 0.1);
            border: 1px solid rgba(100, 181, 246, 0.15);
            max-width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: #64b5f6;
            font-style: italic;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .system-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(100, 181, 246, 0.25);
            border-top-color: #64b5f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        .transcript-speaker {
            font-size: 0.65rem;
            color: #7b8fa8;
            margin-bottom: 0.15rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Controls */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1rem;
        }

        .settings-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: #7b8fa8;
        }

        .toggle-switch {
            position: relative;
            width: 40px;
            height: 22px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.15);
            transition: 0.3s;
            border-radius: 22px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 38px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        .toggle-switch input:checked + .toggle-slider {
            background: linear-gradient(90deg, #64b5f6, #ce93d8);
        }

        .toggle-switch input:checked + .toggle-slider:before {
            transform: translateX(18px);
        }

        .btn {
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(90deg, #64b5f6, #ce93d8);
            color: white;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(100, 181, 246, 0.35);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: rgba(244, 67, 54, 0.2);
            color: #ef5350;
            border: 1px solid rgba(244, 67, 54, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(244, 67, 54, 0.3);
        }

        .status {
            text-align: center;
            padding: 0.35rem;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        .status.connecting { background: rgba(255, 193, 7, 0.15); color: #ffc107; }
        .status.connected { background: rgba(76, 175, 80, 0.15); color: #4caf50; }
        .status.disconnected { background: rgba(244, 67, 54, 0.15); color: #f44336; }
        .status.idle { color: #4a5568; }

        @keyframes recording-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(244, 67, 54, 0); }
        }

        .btn.recording {
            animation: recording-pulse 1.5s infinite;
            background: linear-gradient(90deg, #ef5350, #f48fb1);
        }

        .powered-by {
            position: fixed;
            top: 1rem;
            right: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #7b8fa8;
            font-size: 0.75rem;
            opacity: 0.7;
            z-index: 100;
        }

        .powered-by svg {
            height: 38px;
            width: auto;
        }
    </style>
</head>

    <div class="container">
        <h1>Wanderlust Travel</h1>
        <p class="subtitle">Voice-powered hotel reservations</p>

        <div class="agent-card">
            <div class="agent-avatar" id="agentAvatar">S</div>
            <div class="agent-info">
                <h2 id="agentName">Sophie</h2>
                <p class="role">Reservation Agent</p>
            </div>
            <select id="agentSelect" style="margin-left: auto; margin-right: 0.75rem; padding: 0.35rem 0.5rem; border-radius: 8px; background: rgba(255,255,255,0.08); color: #e8edf5; border: 1px solid rgba(100,181,246,0.25); font-size: 0.85rem; cursor: pointer;">
                <option value="Sophie" selected>Sophie</option>
                <option value="Sydney">Sydney</option>
            </select>
            <div class="recording-indicator" id="recordingIndicator">
                <span class="recording-dot"></span>
                <span>Listening...</span>
            </div>
        </div>

        <div class="main-panels">
            <div class="hotel-panel">
                <div class="panel-header">Hotels & Rooms</div>
                <div class="hotel-content" id="hotelContent">
                    <div class="hotel-empty">
                        Tell Sophie where you'd like to travel and she'll find the perfect hotel for you
                    </div>
                </div>
            </div>

            <div class="transcript-panel">
                <div class="panel-header">Conversation</div>
                <div class="transcript-container" id="transcript">
                </div>
            </div>
        </div>

        <div class="controls-row">
            <div class="settings-toggle">
                <span>Echo Cancel</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="echoCancellation" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <div class="settings-toggle" style="gap: 0.35rem;">
                <span>Padding</span>
                <input type="range" id="paddingBonus" min="-4" max="4" step="0.5" value="0"
                    style="width: 80px; accent-color: #64b5f6; cursor: pointer;">
                <span id="paddingValue" style="min-width: 2em; text-align: center;">0</span>
            </div>

            <button class="btn btn-primary" id="startBtn">Call Sophie</button>
            <button class="btn btn-secondary" id="stopBtn" style="display: none;">Hang Up</button>
        </div>

        <div class="status idle" id="status">Click "Call Sophie" to start your reservation</div>
    </div>

    <script src="/static/js/opus-encoder.js"></script>
    <script src="/static/js/audio-processor.js"></script>
    <script src="/static/js/synced-audio-player.js"></script>
    <script>fetch("/api/audio-config").then(r=>r.json()).then(c=>{window.__pcmOutput=c.pcm})</script>

    <script>
        let ws = null;
        let player = null;
        let isRecording = false;
        let turnBubbles = {};
        let userBubble = null;
        let hadAssistantBubble = false;
        let currentSpeaker = null;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const status = document.getElementById('status');
        const transcript = document.getElementById('transcript');
        const hotelContent = document.getElementById('hotelContent');
        const recordingIndicator = document.getElementById('recordingIndicator');
        const echoCancellationToggle = document.getElementById('echoCancellation');
        const paddingSlider = document.getElementById('paddingBonus');
        const paddingValue = document.getElementById('paddingValue');
        const agentSelect = document.getElementById('agentSelect');

        paddingSlider.addEventListener('input', () => {
            paddingValue.textContent = paddingSlider.value;
        });
        const agentAvatar = document.getElementById('agentAvatar');
        const agentNameEl = document.getElementById('agentName');

        function getAgentName() { return agentSelect.value; }

        agentSelect.addEventListener('change', () => {
            const name = getAgentName();
            agentAvatar.textContent = name[0];
            agentNameEl.textContent = name;
            startBtn.textContent = `Call ${name}`;
            status.textContent = `Click "Call ${name}" to start your reservation`;
            hotelContent.innerHTML = `<div class="hotel-empty">Tell ${name} where you'd like to travel and she'll find the perfect hotel for you</div>`;
        });

        // --- Hotel Display ---

        const _esc = document.createElement('div');
        function esc(t) { _esc.textContent = t; return _esc.innerHTML; }

        function showSearching(msg) {
            hotelContent.innerHTML = `
                <div class="searching">
                    <div class="spinner"></div>
                    <div>${esc(msg)}</div>
                </div>
            `;
        }

        function showHotelResults(data) {
            let html = '';

            // City header
            if (data.city_image) {
                html += `
                    <div class="city-header">
                        <img src="${esc(data.city_image)}" alt="${esc(data.city)}">
                        <div class="city-overlay">
                            <div class="city-name">${esc(data.city)}</div>
                        </div>
                    </div>
                `;
            }

            // Hotel cards
            data.hotels.forEach(hotel => {
                const stars = '&#9733;'.repeat(hotel.stars);
                const phoneHtml = hotel.phone ? `<div class="hotel-card-phone">Tel: ${esc(hotel.phone)}</div>` : '';
                html += `
                    <div class="hotel-card">
                        <img src="${esc(hotel.image_url)}" alt="${esc(hotel.name)}">
                        <div class="hotel-card-body">
                            <div class="hotel-card-name">${esc(hotel.name)}</div>
                            <div class="hotel-card-stars">${stars}</div>
                            <div class="hotel-card-desc">${esc(hotel.description)}</div>
                            <div class="hotel-card-price">${esc(hotel.price_range)}</div>
                            ${phoneHtml}
                            <div class="hotel-card-amenities">
                                ${hotel.amenities.map(a => `<span class="amenity-tag">${esc(a)}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
            });

            hotelContent.innerHTML = html;
        }

        function showHotelDetails(data) {
            const hotel = data.hotel;
            const stars = '&#9733;'.repeat(hotel.stars);
            const phoneHtml = hotel.phone ? `<div class="hotel-card-phone">Tel: ${esc(hotel.phone)}</div>` : '';

            let html = `
                <div class="hotel-card" style="margin-bottom: 1rem;">
                    <img src="${esc(hotel.image_url)}" alt="${esc(hotel.name)}">
                    <div class="hotel-card-body">
                        <div class="hotel-card-name">${esc(hotel.name)}</div>
                        <div class="hotel-card-stars">${stars}</div>
                        <div class="hotel-card-desc">${esc(hotel.description)}</div>
                        ${phoneHtml}
                        <div class="hotel-card-amenities">
                            ${hotel.amenities.map(a => `<span class="amenity-tag">${esc(a)}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `;

            // Room cards
            hotel.rooms.forEach(room => {
                html += `
                    <div class="room-card">
                        <img src="${esc(room.image_url)}" alt="${esc(room.type)}">
                        <div class="room-card-body">
                            <div class="room-card-type">${esc(room.type)}</div>
                            <div class="room-card-price">$${room.price_per_night}/night</div>
                            <div class="room-card-desc">${esc(room.description)}</div>
                            <div class="room-card-guests">Up to ${room.max_guests} guests</div>
                        </div>
                    </div>
                `;
            });

            hotelContent.innerHTML = html;
        }

        function showBookingConfirmed(data) {
            const b = data.booking;
            hotelContent.innerHTML = `
                <div class="booking-card">
                    <h3>Booking Confirmed!</h3>
                    <div class="booking-detail"><span class="label">Hotel</span><span class="value">${esc(b.hotel)}</span></div>
                    <div class="booking-detail"><span class="label">Room</span><span class="value">${esc(b.room)}</span></div>
                    <div class="booking-detail"><span class="label">Check-in</span><span class="value">${esc(b.check_in)}</span></div>
                    <div class="booking-detail"><span class="label">Check-out</span><span class="value">${esc(b.check_out)}</span></div>
                    <div class="booking-detail"><span class="label">Guests</span><span class="value">${b.guests}</span></div>
                    <div class="booking-detail"><span class="label">Guest Name</span><span class="value">${esc(b.guest_name)}</span></div>
                    <div class="booking-detail"><span class="label">Rate</span><span class="value">$${b.price_per_night}/night</span></div>
                    <div class="confirmation-number">${esc(b.confirmation_number)}</div>
                </div>
            `;
        }

        // --- Transcript ---

        function getBubbleForTurn(turnIdx, isUser) {
            if (isUser) {
                if (userBubble && !hadAssistantBubble) return userBubble;
                hadAssistantBubble = false;
                currentSpeaker = 'user';
                userBubble = document.createElement('div');
                userBubble.className = 'transcript-entry user';
                const sp = document.createElement('div');
                sp.className = 'transcript-speaker';
                sp.textContent = 'You';
                userBubble.appendChild(sp);
                const tx = document.createElement('span');
                tx.className = 'transcript-text';
                userBubble.appendChild(tx);
                transcript.appendChild(userBubble);
                return userBubble;
            }

            let bubble = turnBubbles[turnIdx];
            if (!bubble) {
                hadAssistantBubble = true;
                currentSpeaker = 'assistant';
                bubble = document.createElement('div');
                bubble.className = 'transcript-entry assistant';
                const sp = document.createElement('div');
                sp.className = 'transcript-speaker';
                sp.textContent = getAgentName();
                bubble.appendChild(sp);
                const tx = document.createElement('span');
                tx.className = 'transcript-text';
                bubble.appendChild(tx);
                transcript.appendChild(bubble);
                turnBubbles[turnIdx] = bubble;
            }
            return bubble;
        }

        function handleText({ text, turnIdx, isUser }) {
            const bubble = getBubbleForTurn(turnIdx, isUser);
            bubble.querySelector('.transcript-text').textContent += text + ' ';
            // Trim old entries
            while (transcript.children.length > 80) {
                const removed = transcript.removeChild(transcript.firstChild);
                for (const k in turnBubbles) { if (turnBubbles[k] === removed) delete turnBubbles[k]; }
                if (userBubble === removed) userBubble = null;
            }
            transcript.scrollTop = transcript.scrollHeight;
        }

        function addSystemMessage(text, loading = false) {
            currentSpeaker = null;
            const entry = document.createElement('div');
            entry.className = 'transcript-entry system';
            if (loading) {
                entry.innerHTML = `<span class="system-spinner"></span><span>${esc(text)}</span>`;
                entry.dataset.loading = '1';
            } else {
                entry.textContent = text;
            }
            transcript.appendChild(entry);
            transcript.scrollTop = transcript.scrollHeight;
        }

        function clearLoadingMessages() {
            transcript.querySelectorAll('.transcript-entry.system[data-loading]').forEach(el => {
                el.querySelector('.system-spinner')?.remove();
                delete el.dataset.loading;
            });
        }

        // --- WebSocket ---

        function handleMessage(msg) {
            switch (msg.type) {
                case 'tool_started':
                    addSystemMessage(msg.message, true);
                    showSearching(msg.message);
                    break;
                case 'hotel_results':
                    clearLoadingMessages();
                    showHotelResults(msg);
                    break;
                case 'hotel_details':
                    clearLoadingMessages();
                    showHotelDetails(msg);
                    break;
                case 'booking_confirmed':
                    clearLoadingMessages();
                    showBookingConfirmed(msg);
                    break;
                case 'error':
                    console.error('Server error:', msg.message);
                    break;
                case 'event':
                    console.log('Event:', msg.event);
                    break;
            }
        }

        function setStatus(text, cls) {
            status.textContent = text;
            status.className = 'status ' + cls;
        }

        async function startCall() {
            try {
                turnBubbles = {};
                userBubble = null;
                hadAssistantBubble = false;
                currentSpeaker = null;
                const agentName = getAgentName();
                hotelContent.innerHTML = `<div class="hotel-empty">Tell ${agentName} where you'd like to travel and she'll find the perfect hotel for you</div>`;

                setStatus('Connecting...', 'connecting');

                player = new SyncedAudioPlayer({
                    basePath: '/static/js',
                    sampleRate: 24000,
                    pcmOutput: window.__pcmOutput || false,
                    echoCancellation: echoCancellationToggle.checked,
                    onEncodedAudio: (opusData) => {
                        if (isRecording && ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(opusData);
                        }
                    },
                    onText: handleText,
                    onEvent: (eventType, msg) => {
                        handleMessage(msg);
                    },
                    onError: (error) => {
                        console.error('Player error:', error);
                        setStatus('Error: ' + error.message, 'disconnected');
                    }
                });

                try {
                    await player.start();
                } catch (e) {
                    console.error('Audio setup failed:', e);
                    setStatus('Microphone access denied', 'disconnected');
                    return;
                }

                const wsUrl = `ws://${window.location.host}/ws/chat`;
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    setStatus(`Connected - Speak to ${agentName}`, 'connected');
                    transcript.innerHTML = '';
                    ws.send(JSON.stringify({ type: 'start', agent: agentName, padding_bonus: parseFloat(paddingSlider.value) }));
                    agentSelect.disabled = true;
                    paddingSlider.disabled = true;
                    isRecording = true;
                    startBtn.style.display = 'none';
                    stopBtn.style.display = 'inline-block';
                    startBtn.classList.remove('recording');
                    recordingIndicator.classList.add('active');
                };

                ws.onmessage = (event) => {
                    player.handleMessage(event.data);
                };

                ws.onclose = () => {
                    setStatus('Call ended', 'disconnected');
                    endCall();
                };

                ws.onerror = (e) => {
                    console.error('WebSocket error:', e);
                    setStatus('Connection error', 'disconnected');
                    endCall();
                };

            } catch (e) {
                console.error('Failed to start:', e);
                setStatus('Connection failed', 'disconnected');
            }
        }

        function endCall() {
            isRecording = false;
            startBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
            recordingIndicator.classList.remove('active');
            agentSelect.disabled = false;
            paddingSlider.disabled = false;

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'stop' }));
                ws.close();
            }
            ws = null;

            if (player) {
                player.stop();
                player = null;
            }
        }

        startBtn.addEventListener('click', startCall);
        stopBtn.addEventListener('click', endCall);

        // Preload decoder
        AudioProcessor.preloadDecoder('/static/js');
    </script>
</body>
</html>
