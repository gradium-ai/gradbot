[project]
name = "gradbot-demos"
version = "0.1.0"
description = "All Gradbot demos in a single app"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.0,<4.1",
    "fastapi>=0.115.0",
    "gradbot",
    "httpx>=0.27.0",
    "linkup-sdk",
    "openai>=1.50",
    "passlib[bcrypt]>=1.7.4",
    "pillow>=10.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.0",
    "pydantic[email]>=2.7",
    "pyjwt>=2.8.0",
    "pypdfium2>=4.30",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30.0",
    "websockets>=11.0",
]

[tool.uv.sources]
gradbot = { path = "../gradbot_py" }
