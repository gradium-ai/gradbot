[project]
name = "gradbot-demo"
version = "0.1.0"
description = "Gradbot Voice Chat Demo"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=11.0",
    "gradbot",
    "pyyaml>=6.0",
]

[project.scripts]
demo = "main:app"

[tool.uv.sources]
gradbot = { path = "../../gradbot_py" }
