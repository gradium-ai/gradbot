<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Web Search · Gradium + Keenable</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Instrument+Serif&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #15171a;
            --ink-soft: #4a4f57;
            --ink-faint: #828891;
            --surface: #f7f8fa;
            --raised: #ffffff;
            --accent: #2f6df6;
            --accent-soft: #eaf1ff;
            --border: #e6e8ec;
            --danger: #d4493f;
            --active: #2d8a4e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            background: var(--surface);
            background-image:
                radial-gradient(ellipse 70% 50% at 50% -5%, rgba(47,109,246,0.10) 0%, transparent 65%);
            color: var(--ink);
            min-height: 100vh; min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
        }
        .wrap { max-width: 1040px; margin: 0 auto; padding: 2rem 1.5rem 3rem; }
        .header { text-align: center; margin-bottom: 1.75rem; }
        .header h1 {
            font-family: 'Instrument Serif', serif; font-weight: 400;
            font-size: 2.6rem; letter-spacing: -0.01em; line-height: 1.05;
        }
        .header p { color: var(--ink-faint); margin-top: .4rem; font-size: .98rem; }
        .badges { display: flex; gap: .4rem; justify-content: center; margin-top: .7rem; flex-wrap: wrap; }
        .badge {
            font-size: .72rem; font-weight: 600; letter-spacing: .02em;
            color: var(--ink-soft); background: var(--raised);
            border: 1px solid var(--border); border-radius: 999px; padding: .28rem .7rem;
        }

        /* Orb / mic control */
        .control { display: flex; flex-direction: column; align-items: center; gap: .85rem; margin: 1.5rem 0 2rem; }
        .orb {
            width: 96px; height: 96px; border-radius: 50%;
            border: none; cursor: pointer; position: relative;
            background: var(--accent); color: #fff;
            display: grid; place-items: center;
            box-shadow: 0 10px 30px rgba(47,109,246,0.35);
            transition: transform .15s ease, box-shadow .2s ease, background .2s ease;
        }
        .orb:hover { transform: translateY(-2px); }
        .orb.recording { background: var(--danger); box-shadow: 0 10px 30px rgba(212,73,63,0.35); }
        .orb svg { width: 34px; height: 34px; }
        .orb.recording::after {
            content: ''; position: absolute; inset: -10px; border-radius: 50%;
            border: 2px solid rgba(212,73,63,0.4); animation: pulse 1.6s ease-out infinite;
        }
        @keyframes pulse { 0% { transform: scale(.9); opacity: .8; } 100% { transform: scale(1.25); opacity: 0; } }
        .status { font-size: .92rem; color: var(--ink-faint); min-height: 1.2em; }
        .status.active { color: var(--active); font-weight: 600; }
        .status.error { color: var(--danger); font-weight: 600; }

        /* Two-column layout */
        .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem; }
        @media (max-width: 760px) { .panes { grid-template-columns: 1fr; } }
        .pane {
            background: var(--raised); border: 1px solid var(--border);
            border-radius: 16px; padding: 1.1rem 1.15rem; min-height: 340px;
            display: flex; flex-direction: column;
        }
        .pane h2 {
            font-size: .76rem; text-transform: uppercase; letter-spacing: .07em;
            color: var(--ink-faint); font-weight: 700; margin-bottom: .85rem;
        }
        .scroll { overflow-y: auto; flex: 1; }

        /* Transcript */
        .bubble { margin-bottom: .8rem; }
        .bubble .who { font-size: .72rem; font-weight: 700; color: var(--ink-faint); margin-bottom: .2rem; }
        .bubble .txt {
            font-size: .98rem; line-height: 1.5; color: var(--ink);
            background: var(--surface); border-radius: 12px; padding: .55rem .8rem;
        }
        .bubble.assistant .txt { background: var(--accent-soft); }
        .empty { color: var(--ink-faint); font-size: .92rem; font-style: italic; margin-top: .3rem; }

        /* Sources */
        .searching {
            display: flex; align-items: center; gap: .5rem; font-size: .9rem;
            color: var(--accent); font-weight: 600; margin-bottom: .75rem;
        }
        .spinner {
            width: 14px; height: 14px; border: 2px solid var(--accent-soft);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .src-query { font-size: .82rem; color: var(--ink-faint); margin-bottom: .6rem; }
        .card {
            display: block; text-decoration: none; color: inherit;
            border: 1px solid var(--border); border-radius: 12px;
            padding: .65rem .8rem; margin-bottom: .55rem; transition: border-color .15s ease, background .15s ease;
        }
        .card:hover { border-color: var(--accent); background: var(--accent-soft); }
        .card .title { font-size: .92rem; font-weight: 600; line-height: 1.3; }
        .card .src { font-size: .76rem; color: var(--accent); margin: .12rem 0 .25rem; }
        .card .snip { font-size: .82rem; color: var(--ink-soft); line-height: 1.4;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="header">
            <h1>Ask the web, out loud</h1>
            <p>A voice agent that searches the live web and answers in seconds.</p>
            <div class="badges">
                <span class="badge">🎙 Gradium voice</span>
                <span class="badge">🔎 Keenable realtime search</span>
            </div>
        </div>

        <div class="control">
            <button class="orb" id="orb" aria-label="Start voice chat">
                <svg id="iconMic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                <svg id="iconStop" style="display:none" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
            <div class="status" id="status">Tap the mic and ask a question</div>
        </div>

        <div class="panes">
            <div class="pane">
                <h2>Conversation</h2>
                <div class="scroll" id="transcript"><div class="empty" id="tEmpty">Your conversation will appear here.</div></div>
            </div>
            <div class="pane">
                <h2>Web sources</h2>
                <div class="scroll" id="sources"><div class="empty" id="sEmpty">Sources the agent finds will show up here.</div></div>
            </div>
        </div>
    </div>

    <script src="static/js/opus-encoder.js"></script>
    <script src="static/js/audio-processor.js"></script>
    <script src="static/js/synced-audio-player.js"></script>
    <script>fetch("api/audio-config").then(r=>r.json()).then(c=>{window.__pcmOutput=c.pcm}).catch(()=>{})</script>
    <script>
        const orb = document.getElementById('orb');
        const iconMic = document.getElementById('iconMic');
        const iconStop = document.getElementById('iconStop');
        const statusEl = document.getElementById('status');
        const transcript = document.getElementById('transcript');
        const sources = document.getElementById('sources');
        const tEmpty = document.getElementById('tEmpty');
        const sEmpty = document.getElementById('sEmpty');

        let ws = null, player = null, isRecording = false;
        let turnBubbles = {}, userBubble = null, hadAssistant = false;

        function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = 'status' + (cls ? ' ' + cls : ''); }

        // --- transcript ---
        function bubbleFor(turnIdx, isUser) {
            if (tEmpty) tEmpty.remove();
            if (isUser) {
                if (userBubble && !hadAssistant) return userBubble;
                hadAssistant = false;
                userBubble = document.createElement('div');
                userBubble.className = 'bubble user';
                userBubble.innerHTML = '<div class="who">You</div><div class="txt"></div>';
                userBubble._txt = userBubble.querySelector('.txt');
                transcript.appendChild(userBubble);
                return userBubble;
            }
            let b = turnBubbles[turnIdx];
            if (!b) {
                hadAssistant = true;
                b = document.createElement('div');
                b.className = 'bubble assistant';
                b.innerHTML = '<div class="who">Assistant</div><div class="txt"></div>';
                b._txt = b.querySelector('.txt');
                transcript.appendChild(b);
                turnBubbles[turnIdx] = b;
            }
            return b;
        }
        function handleText({ text, turnIdx, isUser }) {
            const b = bubbleFor(turnIdx, isUser);
            b._txt.textContent += text + ' ';
            transcript.scrollTop = transcript.scrollHeight;
        }

        // --- sources panel ---
        function showSearching(query) {
            if (sEmpty && sEmpty.parentNode) sEmpty.remove();
            let s = document.getElementById('searchingRow');
            if (!s) {
                s = document.createElement('div');
                s.className = 'searching'; s.id = 'searchingRow';
                s.innerHTML = '<span class="spinner"></span><span></span>';
                sources.prepend(s);
            }
            s.querySelector('span:last-child').textContent = 'Searching: ' + query;
        }
        function renderSources(query, results) {
            const s = document.getElementById('searchingRow');
            if (s) s.remove();
            const block = document.createElement('div');
            const q = document.createElement('div');
            q.className = 'src-query';
            q.textContent = '🔎 “' + query + '” — ' + results.length + ' result' + (results.length === 1 ? '' : 's');
            block.appendChild(q);
            results.forEach(r => {
                const a = document.createElement('a');
                a.className = 'card'; a.href = r.url; a.target = '_blank'; a.rel = 'noopener';
                a.innerHTML = `<div class="title"></div><div class="src"></div><div class="snip"></div>`;
                a.querySelector('.title').textContent = r.title || 'Untitled';
                a.querySelector('.src').textContent = r.source || '';
                a.querySelector('.snip').textContent = r.snippet || '';
                block.appendChild(a);
            });
            sources.prepend(block);
            sources.scrollTop = 0;
        }

        // --- session control ---
        function toggle() { isRecording ? stop() : start(); }

        async function start() {
            transcript.innerHTML = ''; sources.innerHTML = '';
            turnBubbles = {}; userBubble = null; hadAssistant = false;

            player = new SyncedAudioPlayer({
                basePath: 'static/js',
                sampleRate: 24000,
                pcmOutput: window.__pcmOutput || false,
                echoCancellation: true,
                onEncodedAudio: (opus) => { if (isRecording && ws && ws.readyState === WebSocket.OPEN) ws.send(opus); },
                onText: handleText,
                onEvent: (t, m) => console.log('event', t, m),
                onError: (e) => { console.error(e); setStatus(e.message || 'Audio error', 'error'); },
            });

            try { await player.start(); }
            catch (e) { console.error(e); setStatus('Microphone access denied', 'error'); return; }

            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const base = location.pathname.replace(/\/$/, '');
            ws = new WebSocket(`${proto}//${location.host}${base}/ws/chat`);

            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'start' }));
                isRecording = true;
                orb.classList.add('recording');
                iconMic.style.display = 'none'; iconStop.style.display = 'block';
                setStatus('Listening — ask me anything', 'active');
            };
            ws.onmessage = (ev) => {
                if (typeof ev.data === 'string') {
                    let msg = null;
                    try { msg = JSON.parse(ev.data); } catch (_) {}
                    if (msg && msg.type === 'tool_started') { showSearching(msg.query); return; }
                    if (msg && msg.type === 'search_results') { renderSources(msg.query, msg.results || []); return; }
                }
                player.handleMessage(ev.data);
            };
            ws.onerror = () => setStatus('Connection error', 'error');
            ws.onclose = () => { reset(); if (statusEl.textContent.startsWith('Listening')) setStatus('Disconnected'); };
        }

        function stop() {
            if (ws && ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify({ type: 'stop' })); ws.close(); }
            ws = null;
            if (player) { player.stop(); player = null; }
            reset();
            setStatus('Chat ended — tap the mic to ask more');
        }

        function reset() {
            isRecording = false;
            orb.classList.remove('recording');
            iconMic.style.display = 'block'; iconStop.style.display = 'none';
        }

        orb.addEventListener('click', toggle);
    </script>
</body>
</html>
