[project]
name = "paris-rental-agent"
version = "0.1.0"
description = "AI-powered rental apartment hunting SaaS for Paris (voice + text)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "gradbot>=0.1.8",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30.0",
    "websockets>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
exclude-newer = "7 days"

[tool.uv.audit]
malware-check = true
