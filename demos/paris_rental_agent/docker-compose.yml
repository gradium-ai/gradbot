services:
  db:
    image: postgres:16-alpine
    container_name: paris_rental_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paris_rental_agent
    ports:
      - "5432:5432"
    volumes:
      - paris_rental_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  paris_rental_pgdata:
