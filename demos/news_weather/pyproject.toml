[project]
name = "news-weather-demo"
version = "0.1.0"
description = "News and weather demo with voice AI - no API keys needed"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gradbot",
    "pyyaml>=6.0",
    "feedparser>=6.0.0",
]

[tool.uv.sources]
gradbot = { path = "../../gradbot_py" }
